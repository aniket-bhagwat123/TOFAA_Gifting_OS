[project]
name = "backend"
version = "0.1.0"
description = "TOFAA Gifting OS Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyjwt[crypto]>=2.8.0",
    "supabase>=2.5.0",
    "uvicorn[standard]>=0.30.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "resend>=2.50.0",
]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "e2e: API-level tests through the FastAPI ASGI app",
]
